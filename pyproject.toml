[project]
name = "tactia"
version = "2.0.0"
description = "TactIA: relógio assistivo que classifica sons do ambiente e avisa por vibração"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["ml/_trabalho"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# scripts do pipeline importam config.py antes dos demais módulos (ajusta o sys.path)
"ml/pipeline/*.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ml"]
